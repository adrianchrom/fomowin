<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie PIN | Panel Aplikacji</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script>if (!window.lucide) { document.write('<script src="https://unpkg.com/lucide@latest"><\/script>'); }</script>
  <style>
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
    }
    .glass-btn:active {
      transform: scale(0.92);
      background: rgba(99, 102, 241, 0.4);
    }

    .pin-dot {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pin-dot.active {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.8), 0 0 32px rgba(168, 85, 247, 0.4);
      transform: scale(1.25);
    }
    .pin-dot.success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.95), 0 0 45px rgba(52, 211, 153, 0.7) !important;
      transform: scale(1.4) !important;
      animation: emeraldPulse 0.5s infinite alternate ease-in-out;
    }

    .glass-card.success-border {
      border-color: rgba(16, 185, 129, 0.8) !important;
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.4), inset 0 0 25px rgba(16, 185, 129, 0.25) !important;
      transition: all 0.4s ease;
    }

    @keyframes emeraldPulse {
      0% { transform: scale(1.25); box-shadow: 0 0 15px #10b981; }
      100% { transform: scale(1.45); box-shadow: 0 0 35px #34d399, 0 0 55px #059669; }
    }

    .pin-dot.error {
      background: #f43f5e;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.9);
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* Animated Liquid Ambient Blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: floatBlob 12s infinite alternate ease-in-out;
    }
    .blob-1 {
      top: -10%;
      left: -10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #4f46e5 0%, #7c3aed 100%);
    }
    .blob-2 {
      bottom: -15%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #2563eb 0%, #06b6d4 100%);
      animation-delay: -6s;
    }
    .blob-3 {
      top: 40%;
      left: 30%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #ec4899 0%, #8b5cf6 100%);
      animation-delay: -3s;
      opacity: 0.35;
    }

    @keyframes floatBlob {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    .text-dissolve {
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1) !important;
      filter: blur(24px) brightness(1.4);
      opacity: 0 !important;
      transform: scale(1.3) translateY(-15px) !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

  <!-- Ambient Liquid Gradient Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="w-full max-w-md relative z-10 flex flex-col items-center justify-center">

    <!-- LIQUID GLASS LOGIN CARD -->
    <div id="login-card" class="w-full glass-card p-7 sm:p-8 rounded-3xl space-y-6 transition-all duration-500 text-white">
      
      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-300 mb-1 border border-indigo-500/30 backdrop-blur-md shadow-lg shadow-indigo-500/10">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-200 bg-clip-text text-transparent">
          Wpisz Kod PIN
        </h1>
        <p class="text-xs text-slate-300 font-medium">Unikalny kod PIN odblokowuje Twoje konto</p>
      </div>

      <!-- Error Toast / Box -->
      <div id="error-box" class="hidden bg-rose-500/20 border border-rose-500/40 text-rose-200 p-2.5 rounded-2xl text-center text-xs font-semibold backdrop-blur-md">
        Nieprawidłowy kod PIN. Spróbuj ponownie.
      </div>

      <!-- PIN Indicator Dots -->
      <div class="flex items-center justify-center gap-4 py-2">
        <div id="dot-0" class="w-4 h-4 rounded-full border-2 border-white/30 bg-white/5 pin-dot"></div>
        <div id="dot-1" class="w-4 h-4 rounded-full border-2 border-white/30 bg-white/5 pin-dot"></div>
        <div id="dot-2" class="w-4 h-4 rounded-full border-2 border-white/30 bg-white/5 pin-dot"></div>
        <div id="dot-3" class="w-4 h-4 rounded-full border-2 border-white/30 bg-white/5 pin-dot"></div>
      </div>

      <!-- Glass Numpad -->
      <div class="grid grid-cols-3 gap-3 pt-2">
        <button type="button" onclick="appendPin('1')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">1</button>
        <button type="button" onclick="appendPin('2')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">2</button>
        <button type="button" onclick="appendPin('3')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">3</button>
        <button type="button" onclick="appendPin('4')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">4</button>
        <button type="button" onclick="appendPin('5')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">5</button>
        <button type="button" onclick="appendPin('6')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">6</button>
        <button type="button" onclick="appendPin('7')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">7</button>
        <button type="button" onclick="appendPin('8')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">8</button>
        <button type="button" onclick="appendPin('9')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">9</button>
        <button type="button" onclick="clearPin()" class="glass-btn rounded-2xl py-3.5 text-xs font-bold uppercase tracking-wider text-rose-300">C</button>
        <button type="button" onclick="appendPin('0')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">0</button>
        <button type="button" onclick="backspacePin()" class="glass-btn rounded-2xl py-3.5 text-sm font-bold flex items-center justify-center text-slate-300">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Footer Info -->
      <div class="pt-2 text-center text-[11px] text-slate-400 border-t border-white/10 font-medium">
        System Autoryzacji PIN • FOMO Engine
      </div>

    </div>

    <!-- PURE WELCOME DISSOLVING GREETING -->
    <div id="liquid-welcome" class="hidden text-center transition-all duration-700 opacity-0 scale-95 z-20">
      <h1 id="liquid-name" class="text-5xl sm:text-7xl font-black tracking-tight bg-gradient-to-r from-indigo-300 via-purple-300 to-cyan-300 bg-clip-text text-transparent py-4 drop-shadow-2xl">
        HEJ...
      </h1>
    </div>

  </div>

  <script>
    let enteredPin = '';

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (!dot) continue;
        if (i < enteredPin.length) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active', 'error');
        }
      }
    }

    function appendPin(digit) {
      if (enteredPin.length >= 4) return;
      enteredPin += digit;
      updatePinDots();
      if (enteredPin.length === 4) {
        setTimeout(submitPinLogin, 150);
      }
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots();
      document.getElementById('error-box').classList.add('hidden');
    }

    function backspacePin() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
      }
    }

    // Keyboard support for numpad
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        appendPin(e.key);
      } else if (e.key === 'Backspace') {
        backspacePin();
      } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
        clearPin();
      }
    });

    async function submitPinLogin() {
      const errBox = document.getElementById('error-box');
      const loginCard = document.getElementById('login-card');
      const liquidWelcome = document.getElementById('liquid-welcome');
      const liquidName = document.getElementById('liquid-name');

      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: enteredPin })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          const userCap = data.username ? (data.username.charAt(0).toUpperCase() + data.username.slice(1)) : currentSelectedUser;
          sessionStorage.setItem('fomo_username', userCap);

          // 1. Green Motion Pulse on 4 PIN dots
          for (let i = 0; i < 4; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (dot) {
              dot.classList.remove('active', 'error');
              dot.classList.add('success');
            }
          }
          loginCard.classList.add('success-border');

          // 2. Short pause for green motion celebration, then dissolve
          setTimeout(() => {
            loginCard.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
              loginCard.classList.add('hidden');
              liquidName.innerText = `HEJ ${userCap.toUpperCase()}!`;
              liquidWelcome.classList.remove('hidden');

              setTimeout(() => {
                liquidWelcome.classList.remove('opacity-0', 'scale-95');
                liquidWelcome.classList.add('opacity-100', 'scale-100');
              }, 50);

              setTimeout(() => {
                liquidWelcome.classList.add('text-dissolve');
              }, 900);

              setTimeout(() => {
                window.location.href = '/';
              }, 1700);

            }, 300);
          }, 450);

        } else {
          // Error Shake
          for (let i = 0; i < 4; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (dot) dot.classList.add('error');
          }
          errBox.innerText = data.detail || 'Nieprawidłowy kod PIN.';
          errBox.classList.remove('hidden');
          setTimeout(() => {
            clearPin();
          }, 800);
        }
      } catch (err) {
        errBox.innerText = 'Błąd połączenia z serwerem logowania.';
        errBox.classList.remove('hidden');
        clearPin();
      }
    }

    function safeCreateIcons() {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      } catch (e) {}
    }
    safeCreateIcons();
  </script>
</body>
</html>
