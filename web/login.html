<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weryfikacja Kodem PIN | Glassy OTP V2</title>
  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script>if (!window.lucide) { document.write('<script src="https://unpkg.com/lucide@latest"><\/script>'); }</script>
  <style>
    :root {
      --font-main: 'Inter', 'Poppins', -apple-system, sans-serif;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: var(--font-main);
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Ambient Morphing Liquid Glass Orbs */
    .liquid-orb {
      position: absolute;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      filter: blur(110px);
      opacity: 0.65;
      animation: liquidMorph 18s infinite ease-in-out alternate;
      pointer-events: none;
    }
    .orb-cyan {
      top: -10%;
      left: -10%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #00f2fe 0%, #4facfe 70%);
      animation-duration: 16s;
    }
    .orb-violet {
      bottom: -15%;
      right: -10%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, #7f00ff 0%, #e100ff 70%);
      animation-delay: -5s;
      animation-duration: 22s;
    }
    .orb-emerald {
      top: 35%;
      right: 20%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #10b981 0%, #059669 70%);
      animation-delay: -9s;
      opacity: 0.45;
      animation-duration: 20s;
    }

    @keyframes liquidMorph {
      0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg) scale(1) translate(0px, 0px); }
      34% { border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%; transform: rotate(120deg) scale(1.1) translate(40px, -30px); }
      67% { border-radius: 30% 70% 40% 60% / 50% 30% 70% 40%; transform: rotate(240deg) scale(0.95) translate(-30px, 40px); }
      100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(360deg) scale(1) translate(0px, 0px); }
    }

    /* GLASS CARD MAIN STYLING */
    .liquid-glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 80px -15px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      border-radius: 2.25rem;
    }

    /* NUMPAD BUTTON STYLING */
    .numpad-btn {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }
    .numpad-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(0, 242, 254, 0.4);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 10px 25px -5px rgba(0, 242, 254, 0.25);
    }
    .numpad-btn:active {
      transform: scale(0.92);
      background: rgba(0, 242, 254, 0.3);
      border-color: rgba(0, 242, 254, 0.7);
    }

    /* OTP BOXES STYLING */
    .otp-square {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    .otp-square.focused {
      border-color: #00f2fe !important;
      background: rgba(0, 242, 254, 0.12) !important;
      box-shadow: 
        0 0 25px rgba(0, 242, 254, 0.65), 
        inset 0 0 10px rgba(0, 242, 254, 0.3) !important;
      transform: scale(1.08) translateY(-2px);
    }

    /* MERGE ANIMATION: 4 BOXES -> 1 BOX */
    .otp-wrapper {
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .otp-wrapper.merged {
      gap: 0 !important;
    }
    .otp-wrapper.merged .otp-square:not(:first-child) {
      opacity: 0 !important;
      transform: scale(0) rotate(-45deg) !important;
      width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      overflow: hidden !important;
    }
    .otp-wrapper.merged .otp-square:first-child {
      width: 100px !important;
      height: 100px !important;
      border-radius: 1.75rem !important;
      font-size: 3.5rem !important;
    }

    .otp-wrapper.merged-success .otp-square:first-child {
      background: rgba(16, 185, 129, 0.25) !important;
      border: 2px solid #10b981 !important;
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.9), inset 0 0 25px rgba(16, 185, 129, 0.5) !important;
      animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .otp-wrapper.merged-error .otp-square:first-child {
      background: rgba(244, 63, 94, 0.25) !important;
      border: 2px solid #f43f5e !important;
      box-shadow: 0 0 60px rgba(244, 63, 94, 0.9), inset 0 0 25px rgba(244, 63, 94, 0.5) !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes successPop {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1.05); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    .text-dissolve {
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1) !important;
      filter: blur(24px) brightness(1.4);
      opacity: 0 !important;
      transform: scale(1.3) translateY(-15px) !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative selection:bg-cyan-500/30">

  <!-- Ambient Morphing Liquid Orbs -->
  <div class="liquid-orb orb-cyan"></div>
  <div class="liquid-orb orb-violet"></div>
  <div class="liquid-orb orb-emerald"></div>

  <div class="w-full max-w-md relative z-10 flex flex-col items-center justify-center">

    <!-- MEGA MINIMALIST LIQUID GLASS OTP CARD -->
    <div id="login-card" class="w-full liquid-glass-card p-8 rounded-[2.25rem] space-y-6 transition-all duration-500 text-white">
      
      <!-- Top Drag Bar / Glass Accent Handle (As in Screenshot) -->
      <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-2"></div>

      <!-- Header Title & Subtitle -->
      <div class="text-center space-y-1.5">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-300 bg-clip-text text-transparent">
          Weryfikacja Kodem PIN
        </h1>
        <p class="text-xs text-slate-400 font-medium leading-relaxed max-w-xs mx-auto">
          Podaj Twój 4-cyfrowy unikalny kod autoryzacji.
        </p>
      </div>

      <!-- Error Toast -->
      <div id="error-box" class="hidden bg-rose-500/20 border border-rose-500/40 text-rose-200 p-3 rounded-2xl text-center text-xs font-semibold backdrop-blur-md transition-all duration-300">
        Nieprawidłowy kod PIN. Brak dostępu.
      </div>

      <!-- 4 OTP GLASS SQUARE BOXES -->
      <div id="otp-wrapper" class="otp-wrapper flex items-center justify-center gap-3.5 py-4 transition-all duration-500">
        <div id="otp-box-0" class="otp-square w-14 h-16 sm:w-16 sm:h-20 rounded-2xl flex items-center justify-center text-3xl font-extrabold text-white focused">
          <span id="otp-char-0"></span>
        </div>
        <div id="otp-box-1" class="otp-square w-14 h-16 sm:w-16 sm:h-20 rounded-2xl flex items-center justify-center text-3xl font-extrabold text-white">
          <span id="otp-char-1"></span>
        </div>
        <div id="otp-box-2" class="otp-square w-14 h-16 sm:w-16 sm:h-20 rounded-2xl flex items-center justify-center text-3xl font-extrabold text-white">
          <span id="otp-char-2"></span>
        </div>
        <div id="otp-box-3" class="otp-square w-14 h-16 sm:w-16 sm:h-20 rounded-2xl flex items-center justify-center text-3xl font-extrabold text-white">
          <span id="otp-char-3"></span>
        </div>
      </div>

      <!-- Glass Numpad -->
      <div class="grid grid-cols-3 gap-3 pt-2">
        <button type="button" onclick="appendPin('1')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">1</button>
        <button type="button" onclick="appendPin('2')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">2</button>
        <button type="button" onclick="appendPin('3')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">3</button>
        <button type="button" onclick="appendPin('4')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">4</button>
        <button type="button" onclick="appendPin('5')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">5</button>
        <button type="button" onclick="appendPin('6')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">6</button>
        <button type="button" onclick="appendPin('7')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">7</button>
        <button type="button" onclick="appendPin('8')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">8</button>
        <button type="button" onclick="appendPin('9')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">9</button>
        <button type="button" onclick="clearPin()" class="numpad-btn rounded-2xl py-3.5 text-xs font-extrabold uppercase tracking-wider text-rose-400">C</button>
        <button type="button" onclick="appendPin('0')" class="numpad-btn rounded-2xl py-3.5 text-xl font-bold">0</button>
        <button type="button" onclick="backspacePin()" class="numpad-btn rounded-2xl py-3.5 text-sm font-bold flex items-center justify-center text-slate-300">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Footer Info -->
      <div class="pt-2 text-center text-[11px] text-slate-400 border-t border-white/10 font-medium tracking-wide">
        Autoryzacja • FOMO Engine
      </div>

    </div>

    <!-- PURE WELCOME DISSOLVING GREETING -->
    <div id="liquid-welcome" class="hidden text-center transition-all duration-700 opacity-0 scale-95 z-20">
      <h1 id="liquid-name" class="text-5xl sm:text-7xl font-black tracking-tight bg-gradient-to-r from-cyan-300 via-blue-400 to-emerald-300 bg-clip-text text-transparent py-4 drop-shadow-2xl">
        HEJ...
      </h1>
    </div>

  </div>

  <script>
    let enteredPin = '';
    let isSubmitting = false;

    function updateOtpBoxes() {
      for (let i = 0; i < 4; i++) {
        const box = document.getElementById(`otp-box-${i}`);
        const charSpan = document.getElementById(`otp-char-${i}`);
        if (!box || !charSpan) continue;

        if (i < enteredPin.length) {
          charSpan.innerText = enteredPin[i];
          box.classList.remove('focused');
        } else {
          charSpan.innerText = '';
          if (i === enteredPin.length) {
            box.classList.add('focused');
          } else {
            box.classList.remove('focused');
          }
        }
      }
    }

    function appendPin(digit) {
      if (isSubmitting || enteredPin.length >= 4) return;
      enteredPin += digit;
      updateOtpBoxes();
      if (enteredPin.length === 4) {
        isSubmitting = true;
        setTimeout(submitPinLogin, 150);
      }
    }

    function clearPin() {
      enteredPin = '';
      isSubmitting = false;
      const wrapper = document.getElementById('otp-wrapper');
      const box0Span = document.getElementById('otp-char-0');
      
      if (wrapper) {
        wrapper.className = 'otp-wrapper flex items-center justify-center gap-3.5 py-4 transition-all duration-500';
      }
      if (box0Span) box0Span.innerText = '';

      updateOtpBoxes();
      document.getElementById('error-box').classList.add('hidden');
    }

    function backspacePin() {
      if (isSubmitting || enteredPin.length === 0) return;
      enteredPin = enteredPin.slice(0, -1);
      updateOtpBoxes();
    }

    // Keyboard support for numpad & physical keys
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        appendPin(e.key);
      } else if (e.key === 'Backspace') {
        backspacePin();
      } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
        clearPin();
      }
    });

    async function submitPinLogin() {
      const errBox = document.getElementById('error-box');
      const loginCard = document.getElementById('login-card');
      const wrapper = document.getElementById('otp-wrapper');
      const box0Span = document.getElementById('otp-char-0');
      const liquidWelcome = document.getElementById('liquid-welcome');
      const liquidName = document.getElementById('liquid-name');

      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: enteredPin })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          const userCap = data.username ? (data.username.charAt(0).toUpperCase() + data.username.slice(1)) : 'Użytkownik';
          sessionStorage.setItem('fomo_username', userCap);

          // 1. MOTION MERGE: Merge 4 boxes into 1 green checkmark square
          wrapper.className = 'otp-wrapper flex items-center justify-center gap-3.5 py-4 transition-all duration-500 merged merged-success';
          box0Span.innerHTML = '✓';

          // 2. Liquid Welcome transition
          setTimeout(() => {
            loginCard.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
              loginCard.classList.add('hidden');
              liquidName.innerText = `HEJ ${userCap.toUpperCase()}!`;
              liquidWelcome.classList.remove('hidden');

              setTimeout(() => {
                liquidWelcome.classList.remove('opacity-0', 'scale-95');
                liquidWelcome.classList.add('opacity-100', 'scale-100');
              }, 50);

              setTimeout(() => {
                liquidWelcome.classList.add('text-dissolve');
              }, 900);

              setTimeout(() => {
                window.location.href = '/';
              }, 1700);

            }, 300);
          }, 600);

        } else {
          // 1. MOTION MERGE ERROR: Merge 4 boxes into 1 red cross square with shake
          wrapper.className = 'otp-wrapper flex items-center justify-center gap-3.5 py-4 transition-all duration-500 merged merged-error';
          box0Span.innerHTML = '✕';

          errBox.innerText = data.detail || 'Nieprawidłowy kod PIN. Brak dostępu.';
          errBox.classList.remove('hidden');

          // Un-merge back to 4 empty boxes after 900ms
          setTimeout(() => {
            clearPin();
          }, 1000);
        }
      } catch (err) {
        wrapper.className = 'otp-wrapper flex items-center justify-center gap-3.5 py-4 transition-all duration-500 merged merged-error';
        box0Span.innerHTML = '✕';
        errBox.innerText = 'Błąd połączenia z serwerem logowania.';
        errBox.classList.remove('hidden');
        setTimeout(() => {
          clearPin();
        }, 1000);
      }
    }

    function safeCreateIcons() {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      } catch (e) {}
    }
    safeCreateIcons();
  </script>
</body>
</html>
