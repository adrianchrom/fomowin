<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie | FOMO Signal Engine</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #030712; color: #cbd5e1; font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    
    /* BLACK & BLUE STYLING */
    .glass-login-box {
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(29, 78, 216, 0.15);
    }
    
    .blue-glow-bg {
      background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.25), rgba(29, 78, 216, 0.12), rgba(15, 23, 42, 0.8), transparent 75%);
    }

    .btn-blue {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-blue:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }
    .btn-blue:active { transform: translateY(0.5px) scale(0.97); }

    .text-blue-glow {
      text-shadow: 0 0 30px rgba(59, 130, 246, 0.6), 0 0 60px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Blue Ambient Glow -->
  <div class="absolute inset-0 blue-glow-bg pointer-events-none"></div>

  <div class="w-full max-w-2xl relative z-10 flex flex-col items-center justify-center">

    <!-- LOGIN FORM CARD -->
    <div id="login-card" class="w-full max-w-md glass-login-box p-8 sm:p-10 rounded-3xl space-y-6 shadow-2xl transition-all duration-500">
      
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-blue-950/80 border border-blue-500/30 flex items-center justify-center mx-auto text-2xl shadow-inner text-blue-400">
          ⚡
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">FOMO Signal Engine</h1>
        <p class="text-xs text-blue-300/80">Dostęp zarezerwowany dla autoryzowanych użytkowników</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div id="error-box" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3 rounded-xl text-center font-medium">
          Nieprawidłowy użytkownik lub hasło.
        </div>

        <div>
          <label class="block text-blue-200 font-semibold mb-1.5 uppercase tracking-wider">Użytkownik:</label>
          <div class="relative">
            <input type="text" id="username" placeholder="Wpisz 'Adrian' lub 'Maciek'" required class="w-full bg-slate-950/90 border border-blue-900/60 rounded-xl px-3.5 py-3 pl-10 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition">
            <i data-lucide="user" class="w-4 h-4 text-blue-400/70 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <div>
          <label class="block text-blue-200 font-semibold mb-1.5 uppercase tracking-wider">Hasło:</label>
          <div class="relative">
            <input type="password" id="password" placeholder="Wpisz wygenerowane hasło" required class="w-full bg-slate-950/90 border border-blue-900/60 rounded-xl px-3.5 py-3 pl-10 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition">
            <i data-lucide="key-round" class="w-4 h-4 text-blue-400/70 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-blue w-full text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 cursor-pointer text-sm">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Zaloguj się
        </button>
      </form>

      <div class="border-t border-blue-900/40 pt-4 text-center text-[11px] text-slate-400 space-y-1">
        <p>⚠️ Dostęp posiadają tylko: <b class="text-blue-300">Adrian</b> oraz <b class="text-blue-300">Maciek</b></p>
      </div>

    </div>


    <!-- PURE GREETING TEXT ONLY - NO BOXES, NO FRAMES, NO RECTANGLES -->
    <div id="liquid-welcome" class="hidden text-center transition-all duration-700 opacity-0 scale-95">
      <h1 id="liquid-name" class="text-6xl sm:text-8xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-100 via-blue-300 to-blue-500 text-blue-glow py-4">
        HEJ MACIEK!
      </h1>
    </div>

  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const loginCard = document.getElementById('login-card');
      const liquidWelcome = document.getElementById('liquid-welcome');
      const liquidName = document.getElementById('liquid-name');
      const submitBtn = document.getElementById('submit-btn');

      errBox.classList.add('hidden');

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
          const userCap = data.username ? (data.username.charAt(0).toUpperCase() + data.username.slice(1)) : u;
          sessionStorage.setItem('fomo_username', userCap);

          // Hide Login Card completely
          loginCard.classList.add('opacity-0', 'scale-95');
          
          setTimeout(() => {
            loginCard.classList.add('hidden');
            
            // Display ONLY PURE TEXT with blue glow - NO BOXES OR FRAMES
            liquidName.innerText = `HEJ ${userCap.toUpperCase()}!`;
            liquidWelcome.classList.remove('hidden');
            
            setTimeout(() => {
              liquidWelcome.classList.remove('opacity-0', 'scale-95');
              liquidWelcome.classList.add('opacity-100', 'scale-100');
            }, 50);

            // Smooth redirect to dashboard
            setTimeout(() => {
              window.location.href = '/';
            }, 1800);

          }, 300);

        } else {
          errBox.innerText = data.detail || 'Nieprawidłowy użytkownik lub hasło.';
          errBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-50');
        }
      } catch (err) {
        errBox.innerText = 'Błąd połączenia z serwerem logowania.';
        errBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    }
    lucide.createIcons();
  </script>
</body>
</html>
