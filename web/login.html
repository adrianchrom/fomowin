<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie | Panel Aplikacji</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (jsDelivr + unpkg fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script>if (!window.lucide) { document.write('<script src="https://unpkg.com/lucide@latest"><\/script>'); }</script>
  <style>
    body { background-color: #f8fafc; color: #0f172a; font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    
    .clean-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:active { transform: translateY(0.5px); }

    .text-dissolve {
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1) !important;
      filter: blur(24px) brightness(1.2);
      opacity: 0 !important;
      transform: scale(1.2) translateY(-15px) !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative bg-slate-50">

  <div class="w-full max-w-md relative z-10 flex flex-col items-center justify-center">

    <!-- LOGIN FORM CARD -->
    <div id="login-card" class="w-full clean-card p-8 sm:p-10 rounded-3xl space-y-6 transition-all duration-500">
      
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 mb-2 border border-blue-100">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Panel Zalogowania</h1>
        <p class="text-xs text-slate-500">Zaloguj się, aby uzyskać dostęp do aplikacji</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
        <div id="error-box" class="hidden bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-center font-medium">
          Nieprawidłowy użytkownik lub hasło.
        </div>

        <div>
          <label class="block text-slate-700 font-semibold mb-1.5 uppercase tracking-wider text-[11px]">Użytkownik:</label>
          <div class="relative">
            <input type="text" id="username" placeholder="Wpisz 'Adrian' lub 'Maciek'" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 pl-10 text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 focus:outline-none transition font-medium">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <div>
          <label class="block text-slate-700 font-semibold mb-1.5 uppercase tracking-wider text-[11px]">Hasło:</label>
          <div class="relative">
            <input type="password" id="password" placeholder="Wpisz wygenerowane hasło" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 pl-10 text-slate-900 placeholder-slate-400 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 focus:outline-none transition font-medium">
            <i data-lucide="key-round" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <div class="flex items-center justify-between py-1 text-xs">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600 hover:text-slate-900 select-none font-medium">
            <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded bg-slate-100 border border-slate-300 text-blue-600 focus:ring-2 focus:ring-blue-500/20 cursor-pointer">
            <span>Zapamiętaj dane logowania</span>
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary w-full text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 cursor-pointer text-sm">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Zaloguj się
        </button>
      </form>

      <div class="border-t border-slate-100 pt-4 text-center text-[11px] text-slate-400 font-medium">
        Autoryzowani użytkownicy: <b class="text-slate-700">Adrian</b> | <b class="text-slate-700">Maciek</b>
      </div>

    </div>

    <!-- PURE WELCOME DISSOLVING GREETING -->
    <div id="liquid-welcome" class="hidden text-center transition-all duration-700 opacity-0 scale-95">
      <h1 id="liquid-name" class="text-5xl sm:text-7xl font-black tracking-tight text-blue-600 py-4 drop-shadow-sm">
        HEJ...
      </h1>
    </div>

  </div>

  <script>
    function quickLogin(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
      document.getElementById('login-form').requestSubmit();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const loginCard = document.getElementById('login-card');
      const liquidWelcome = document.getElementById('liquid-welcome');
      const liquidName = document.getElementById('liquid-name');
      const submitBtn = document.getElementById('submit-btn');

      errBox.classList.add('hidden');

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const rememberMe = document.getElementById('remember-me').checked;

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
          const userCap = data.username ? (data.username.charAt(0).toUpperCase() + data.username.slice(1)) : u;
          sessionStorage.setItem('fomo_username', userCap);

          if (rememberMe) {
            localStorage.setItem('fomo_saved_username', data.username || u);
            localStorage.setItem('fomo_saved_password', p);
            localStorage.setItem('fomo_remember_me', 'true');
          } else {
            localStorage.removeItem('fomo_saved_username');
            localStorage.removeItem('fomo_saved_password');
            localStorage.removeItem('fomo_remember_me');
          }

          // Hide Login Card completely
          loginCard.classList.add('opacity-0', 'scale-95');
          
          setTimeout(() => {
            loginCard.classList.add('hidden');
            
            // Display pure welcome text with dissolve effect
            liquidName.innerText = `HEJ ${userCap.toUpperCase()}!`;
            liquidWelcome.classList.remove('hidden');
            
            setTimeout(() => {
              liquidWelcome.classList.remove('opacity-0', 'scale-95');
              liquidWelcome.classList.add('opacity-100', 'scale-100');
            }, 50);

            // Dissolve effect
            setTimeout(() => {
              liquidWelcome.classList.add('text-dissolve');
            }, 900);

            // Redirect to clean dashboard
            setTimeout(() => {
              window.location.href = '/';
            }, 1800);

          }, 300);

        } else {
          errBox.innerText = data.detail || 'Nieprawidłowy użytkownik lub hasło.';
          errBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-50');
        }
      } catch (err) {
        errBox.innerText = 'Błąd połączenia z serwerem logowania.';
        errBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    }
    safeCreateIcons();
  </script>
</body>
</html>
