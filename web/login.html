<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weryfikacja Kodem PIN | Glassy OTP</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script>if (!window.lucide) { document.write('<script src="https://unpkg.com/lucide@latest"><\/script>'); }</script>
  <style>
    body {
      background-color: #070913;
      color: #f8fafc;
      font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-btn:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
    }
    .glass-btn:active {
      transform: scale(0.92);
      background: rgba(59, 130, 246, 0.45);
    }

    /* OTP BOXES MOTION ANIMATION STYLES */
    .otp-box {
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .otp-box.active-focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.7), inset 0 0 10px rgba(59, 130, 246, 0.3) !important;
      transform: scale(1.06);
      background: rgba(59, 130, 246, 0.12) !important;
    }

    /* MERGED SUCCESS / FAILURE MOTION STYLES */
    .otp-container.merged .otp-box:not(:first-child) {
      display: none !important;
    }
    .otp-container.merged .otp-box:first-child {
      width: 100% !important;
      max-width: 120px !important;
      height: 110px !important;
      border-radius: 1.5rem !important;
      font-size: 3rem !important;
    }

    .otp-container.merged-success .otp-box:first-child {
      background: rgba(16, 185, 129, 0.2) !important;
      border: 2px solid #10b981 !important;
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.8), inset 0 0 20px rgba(16, 185, 129, 0.4) !important;
      animation: mergeSuccessPulse 0.6s ease-in-out infinite alternate;
    }

    .otp-container.merged-error .otp-box:first-child {
      background: rgba(244, 63, 94, 0.2) !important;
      border: 2px solid #f43f5e !important;
      box-shadow: 0 0 50px rgba(244, 63, 94, 0.8), inset 0 0 20px rgba(244, 63, 94, 0.4) !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes mergeSuccessPulse {
      0% { transform: scale(1.05); }
      100% { transform: scale(1.15); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* Ambient Liquid Gradient Blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: floatBlob 14s infinite alternate ease-in-out;
    }
    .blob-1 {
      top: -10%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #2563eb 0%, #1d4ed8 100%);
    }
    .blob-2 {
      bottom: -15%;
      right: -10%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #3b82f6 0%, #06b6d4 100%);
      animation-delay: -7s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    .text-dissolve {
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1) !important;
      filter: blur(24px) brightness(1.4);
      opacity: 0 !important;
      transform: scale(1.3) translateY(-15px) !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

  <!-- Ambient Liquid Gradient Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="w-full max-w-md relative z-10 flex flex-col items-center justify-center">

    <!-- LIQUID GLASS OTP CARD -->
    <div id="login-card" class="w-full glass-card p-8 rounded-3xl space-y-6 transition-all duration-500 text-white">
      
      <!-- Top Accent Bar -->
      <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-2"></div>

      <!-- Header -->
      <div class="text-center space-y-1.5">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
          Weryfikacja Kodem PIN
        </h1>
        <p class="text-xs text-slate-400 font-medium leading-relaxed">
          Podaj Twój 4-cyfrowy unikalny kod autoryzacji.
        </p>
      </div>

      <!-- Error Toast / Box -->
      <div id="error-box" class="hidden bg-rose-500/20 border border-rose-500/40 text-rose-200 p-3 rounded-2xl text-center text-xs font-semibold backdrop-blur-md animate-emerge">
        Nieprawidłowy kod PIN. Brak dostępu.
      </div>

      <!-- 4 OTP GLASS SQUARE BOXES (IMAGE LAYOUT MATCH) -->
      <div id="otp-container" class="flex items-center justify-center gap-3.5 py-3 transition-all duration-500">
        <div id="otp-box-0" class="otp-box w-14 h-16 sm:w-16 sm:h-20 rounded-2xl border border-white/20 bg-white/5 flex items-center justify-center text-3xl font-black text-white shadow-inner active-focus">
          <span id="otp-char-0"></span>
        </div>
        <div id="otp-box-1" class="otp-box w-14 h-16 sm:w-16 sm:h-20 rounded-2xl border border-white/20 bg-white/5 flex items-center justify-center text-3xl font-black text-white shadow-inner">
          <span id="otp-char-1"></span>
        </div>
        <div id="otp-box-2" class="otp-box w-14 h-16 sm:w-16 sm:h-20 rounded-2xl border border-white/20 bg-white/5 flex items-center justify-center text-3xl font-black text-white shadow-inner">
          <span id="otp-char-2"></span>
        </div>
        <div id="otp-box-3" class="otp-box w-14 h-16 sm:w-16 sm:h-20 rounded-2xl border border-white/20 bg-white/5 flex items-center justify-center text-3xl font-black text-white shadow-inner">
          <span id="otp-char-3"></span>
        </div>
      </div>

      <!-- Glass Numpad -->
      <div class="grid grid-cols-3 gap-3 pt-2">
        <button type="button" onclick="appendPin('1')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">1</button>
        <button type="button" onclick="appendPin('2')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">2</button>
        <button type="button" onclick="appendPin('3')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">3</button>
        <button type="button" onclick="appendPin('4')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">4</button>
        <button type="button" onclick="appendPin('5')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">5</button>
        <button type="button" onclick="appendPin('6')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">6</button>
        <button type="button" onclick="appendPin('7')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">7</button>
        <button type="button" onclick="appendPin('8')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">8</button>
        <button type="button" onclick="appendPin('9')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">9</button>
        <button type="button" onclick="clearPin()" class="glass-btn rounded-2xl py-3.5 text-xs font-bold uppercase tracking-wider text-rose-400">C</button>
        <button type="button" onclick="appendPin('0')" class="glass-btn rounded-2xl py-3.5 text-xl font-bold">0</button>
        <button type="button" onclick="backspacePin()" class="glass-btn rounded-2xl py-3.5 text-sm font-bold flex items-center justify-center text-slate-300">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Footer Info -->
      <div class="pt-2 text-center text-[11px] text-slate-400 border-t border-white/10 font-medium">
        Autoryzacja • FOMO Engine
      </div>

    </div>

    <!-- PURE WELCOME DISSOLVING GREETING -->
    <div id="liquid-welcome" class="hidden text-center transition-all duration-700 opacity-0 scale-95 z-20">
      <h1 id="liquid-name" class="text-5xl sm:text-7xl font-black tracking-tight bg-gradient-to-r from-blue-300 via-indigo-300 to-cyan-300 bg-clip-text text-transparent py-4 drop-shadow-2xl">
        HEJ...
      </h1>
    </div>

  </div>

  <script>
    let enteredPin = '';
    let isSubmitting = false;

    function updateOtpBoxes() {
      for (let i = 0; i < 4; i++) {
        const box = document.getElementById(`otp-box-${i}`);
        const charSpan = document.getElementById(`otp-char-${i}`);
        if (!box || !charSpan) continue;

        if (i < enteredPin.length) {
          charSpan.innerText = enteredPin[i];
          box.classList.remove('active-focus');
        } else {
          charSpan.innerText = '';
          if (i === enteredPin.length) {
            box.classList.add('active-focus');
          } else {
            box.classList.remove('active-focus');
          }
        }
      }
    }

    function appendPin(digit) {
      if (isSubmitting || enteredPin.length >= 4) return;
      enteredPin += digit;
      updateOtpBoxes();
      if (enteredPin.length === 4) {
        isSubmitting = true;
        setTimeout(submitPinLogin, 150);
      }
    }

    function clearPin() {
      enteredPin = '';
      isSubmitting = false;
      const container = document.getElementById('otp-container');
      const box0Span = document.getElementById('otp-char-0');
      
      if (container) {
        container.className = 'flex items-center justify-center gap-3.5 py-3 transition-all duration-500';
      }
      if (box0Span) box0Span.innerText = '';

      updateOtpBoxes();
      document.getElementById('error-box').classList.add('hidden');
    }

    function backspacePin() {
      if (isSubmitting || enteredPin.length === 0) return;
      enteredPin = enteredPin.slice(0, -1);
      updateOtpBoxes();
    }

    // Keyboard support for numpad
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        appendPin(e.key);
      } else if (e.key === 'Backspace') {
        backspacePin();
      } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
        clearPin();
      }
    });

    async function submitPinLogin() {
      const errBox = document.getElementById('error-box');
      const loginCard = document.getElementById('login-card');
      const container = document.getElementById('otp-container');
      const box0Span = document.getElementById('otp-char-0');
      const liquidWelcome = document.getElementById('liquid-welcome');
      const liquidName = document.getElementById('liquid-name');

      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: enteredPin })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          const userCap = data.username ? (data.username.charAt(0).toUpperCase() + data.username.slice(1)) : 'Użytkownik';
          sessionStorage.setItem('fomo_username', userCap);

          // 1. MOTION MERGE: Merge 4 boxes into 1 green checkmark square
          container.className = 'flex items-center justify-center gap-3.5 py-3 transition-all duration-500 merged merged-success';
          box0Span.innerHTML = '✓';

          // 2. Liquid Welcome transition
          setTimeout(() => {
            loginCard.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
              loginCard.classList.add('hidden');
              liquidName.innerText = `HEJ ${userCap.toUpperCase()}!`;
              liquidWelcome.classList.remove('hidden');

              setTimeout(() => {
                liquidWelcome.classList.remove('opacity-0', 'scale-95');
                liquidWelcome.classList.add('opacity-100', 'scale-100');
              }, 50);

              setTimeout(() => {
                liquidWelcome.classList.add('text-dissolve');
              }, 900);

              setTimeout(() => {
                window.location.href = '/';
              }, 1700);

            }, 300);
          }, 600);

        } else {
          // 1. MOTION MERGE ERROR: Merge 4 boxes into 1 red cross square with shake
          container.className = 'flex items-center justify-center gap-3.5 py-3 transition-all duration-500 merged merged-error';
          box0Span.innerHTML = '✕';

          errBox.innerText = data.detail || 'Nieprawidłowy kod PIN. Brak dostępu.';
          errBox.classList.remove('hidden');

          // Un-merge back to 4 empty boxes after 900ms
          setTimeout(() => {
            clearPin();
          }, 1000);
        }
      } catch (err) {
        container.className = 'flex items-center justify-center gap-3.5 py-3 transition-all duration-500 merged merged-error';
        box0Span.innerHTML = '✕';
        errBox.innerText = 'Błąd połączenia z serwerem logowania.';
        errBox.classList.remove('hidden');
        setTimeout(() => {
          clearPin();
        }, 1000);
      }
    }

    function safeCreateIcons() {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      } catch (e) {}
    }
    safeCreateIcons();
  </script>
</body>
</html>
