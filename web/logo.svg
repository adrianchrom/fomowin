<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050c1e" flood-opacity="0.65" />
    </filter>
  </defs>
  
  <!-- Full-bleed background with zero borders -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" fill="url(#cyanGlow)" />
  
  <!-- Typography Ach! -->
  <g filter="url(#textGlow)">
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Rounded MT Bold', 'Arial Rounded Bold', 'SF Pro Rounded', -apple-system, sans-serif"
          font-weight="900" font-size="205" fill="#ffffff" letter-spacing="-1">
      Ach<tspan fill="#38bdf8">!</tspan>
    </text>
  </g>
</svg>
