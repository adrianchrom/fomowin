<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Squircle Base -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#cyanGlow)" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="rgba(0,242,254,0.18)" stroke-width="2" />
  
  <!-- Typography Ach! -->
  <g filter="url(#textGlow)">
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system, 'Poppins', 'Inter', 'Avenir Next', sans-serif"
          font-weight="900" font-size="205" fill="#ffffff" letter-spacing="-2">
      Ach<tspan fill="#00f2fe">!</tspan>
    </text>
  </g>
</svg>
